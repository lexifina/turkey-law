<style>

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

.dek { color: var(--text-2); margin: 0 0 12px; max-width: 820px; }

.plot { width: 100%; position: relative; }

.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.5; }

details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.3 Inter, sans-serif; }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.3 Inter, sans-serif; color: var(--text-2); }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.1 Inter, sans-serif; color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 16px 0 4px; font: 600 13px/1.3 Inter, sans-serif; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 16px; }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>

<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
let LANG = 'tr';
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'tr') LANG = q; else { const s = localStorage.getItem('tr-viz-lang'); if (s === 'en' || s === 'tr') LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const t = localStorage.getItem('tr-viz-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

// ------------------------------------------------------------------ strings
const S = {
tr: {
  title: '20 grafikte Türk hukuku',
  lede: `Yalnızca bu deponun verilerinden çizilmiş yirmi grafik: Resmî Gazete'de yayımlanan her kanunun dizini, Genel Kurulun tutanak dizini ve Meclis kararları, yürürlükteki kanunların değişiklik notları ve yürürlük tabloları, Anayasa, 2001'den bu yana Resmî Gazete'nin günlük fihristi, üç büyükşehir belediye meclisinin kararları ve Anayasa Mahkemesinin kararları.`,
  profile_h: 'Veri profili: neler kullanıldı ve ne kadar eksiksiz',
  tbl: 'Veri tablosu', src: 'Depodaki kaynak', n: 'Kayıt', cover: 'Kapsam', caveat: 'Sınırlama',
  ds: 'Veri kümesi', foot: `lexifina/turkey-law deposundan oluşturuldu ({built}). Sayıları visualisations/src/prep.py git geçmişinden ve data/ altındaki tablolardan hesaplar; sayfayı build.py birleştirir. Grafiklerin hepsi betimleyicidir: kaynakların neyi kaydettiğini gösterir, nedenini değil.`,
  tiles: ['commit', 'kanun dizinde', 'değişiklik notu', `Resmî Gazete yazısı`, 'Genel Kurul tutanak kaydı', 'bireysel başvuru kararı'],
  year: 'Yıl', total: 'Toplam', share: 'Pay', count: 'Sayı', partial: 'eksik yıl', term: 'Dönem',
  gl: `Tüm global-law'dan, her ülkenin hukuku üzerine grafikler: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. Burada yalnızca Türkiye ile ilgili grafikler var.`,
},
en: {
  title: 'Turkish law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the index of every law published in the Resmî Gazete, the index of plenary minutes and the decisions of the Grand National Assembly, the amendment notes and in-force tables of the laws in force, the Constitution, the daily index of the Resmî Gazete since 2001, the decisions of three metropolitan councils and the decisions of the Constitutional Court.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/turkey-law repository ({built}). The numbers are computed by visualisations/src/prep.py from the git history and the tables under data/; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  tiles: ['commits', 'laws in the index', 'amendment notes', 'Resmî Gazete items', 'plenary minutes records', 'individual-application decisions'],
  year: 'Year', total: 'Total', share: 'Share', count: 'Count', partial: 'partial year', term: 'Term',
  gl: 'Charts on every country\'s law, from the whole of global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. These are the charts on Türkiye alone.',
}};
const t = k => S[LANG][k];
const L = (tr, en) => LANG === 'tr' ? tr : en;
const fmt = n => (n == null ? '–' : (+n).toLocaleString(LANG === 'tr' ? 'tr-TR' : 'en-GB'));
const dec = (v, d = 1) => (+v).toFixed(d).replace('.', LANG === 'tr' ? ',' : '.');
const pv = (v, d = 0) => LANG === 'tr' ? '%' + dec(v, d) : dec(v, d) + '%';
const pct = (a, b, d = 0) => b ? pv(100 * a / b, d) : '–';
const MONTHS = { tr: ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const AYLAR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'tr' ? `${d} ${AYLAR[m - 1]} ${y}` : `${d} ${MONTHS_EN[m - 1]} ${y}`; };
const dateShort = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'tr' ? `${d}.${String(m).padStart(2, '0')}.${y}` : `${d} ${MONTHS.en[m - 1]} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const PD = s => d3.timeParse('%Y-%m-%d')(s);
const YD = s => +s.slice(0, 4) + (d3.timeDay.count(d3.timeYear(PD(s)), PD(s)) / 365.25);

// Turkish case suffixes after a number, by the last word it is read with (vowel harmony, consonant hardening)
const UNITS = ['sıfır', 'bir', 'iki', 'üç', 'dört', 'beş', 'altı', 'yedi', 'sekiz', 'dokuz'], TENS = ['', 'on', 'yirmi', 'otuz', 'kırk', 'elli', 'altmış', 'yetmiş', 'seksen', 'doksan'];
function lastWord(v) {
  const s = String(v).replace(/[%\s]/g, '');
  if (s.includes(',')) { const f = s.split(',')[1].replace(/0+$/, ''); if (f) return UNITS[+f[f.length - 1]]; }
  const n = Math.abs(parseInt(s.split(',')[0].replace(/\./g, ''), 10) || 0);
  if (n === 0) return 'sıfır';
  if (n % 10) return UNITS[n % 10];
  if (n % 100) return TENS[(n % 100) / 10];
  if (n % 1000) return 'yüz';
  return n % 1000000 ? 'bin' : 'milyon';
}
function sfx(v, kind) {
  const w = lastWord(v), vow = [...w].reverse().find(ch => 'aıoueiöü'.includes(ch)), last = w[w.length - 1];
  const a2 = 'eiöü'.includes(vow) ? 'e' : 'a', i4 = { a: 'ı', ı: 'ı', o: 'u', u: 'u', e: 'i', i: 'i', ö: 'ü', ü: 'ü' }[vow];
  const ev = 'aıoueiöü'.includes(last), hard = 'fstkçşhp'.includes(last);
  return { loc: (hard ? 't' : 'd') + a2, abl: (hard ? 't' : 'd') + a2 + 'n', dat: (ev ? 'y' : '') + a2, acc: (ev ? 'y' : '') + i4, gen: (ev ? 'n' : '') + i4 + 'n',
    poss: (ev ? 's' : '') + i4, possloc: (ev ? 's' : '') + i4 + 'nd' + a2, pl: 'l' + a2 + 'r', plloc: 'l' + a2 + 'rd' + a2 }[kind];
}
const nS = (v, kind) => `${v}'${sfx(v, kind)}`;                 // 2018'de, 1990'larda, %78'i
const trLower = s => s.replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase();
const SMALL = new Set(['ve', 'ile', 'veya', 'ya', 'da', 'de', 'için', 'ilişkin', 'dair', 'hakkında', 'bazı', 'diğer', 'sayılı', 'olan', 'ait']);
const tcase = s => trLower(s).split(/\s+/).map((w, i) => (i && SMALL.has(w)) ? w : w.charAt(0).toLocaleUpperCase('tr-TR') + w.slice(1)).join(' ');
const decTR = d => `${d}'${sfx(d, 'pl')}`;                       // 1920'ler
const decName = d => L(decTR(d), d + 's');

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c).style('border-color', it.c); s.append('span').text(it.l); });
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
}
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  p.html(`<b>${t('src')}:</b> ${src.map(s => `<code>${esc(s)}</code>`).join(' ')} · <b>${t('n')}:</b> ${n}${extra ? ' · ' + esc(extra) : ''}`);
}
function yAxis(g, y, w, ticks = 5, f = fmt) {
  const ax = g.append('g').attr('class', 'axis grid');
  y.ticks(ticks).forEach(v => {
    ax.append('line').attr('x1', 0).attr('x2', w).attr('y1', y(v)).attr('y2', y(v));
    ax.append('text').attr('x', -6).attr('y', y(v)).attr('dy', '0.32em').attr('text-anchor', 'end').text(f(v));
  });
}
const W = el => Math.max(300, Math.min(1000, el.node().getBoundingClientRect().width || 900));
const narrow = w => w < 560;
const WR = el => Math.max(120, el.node().getBoundingClientRect().width || 300);
function colPath(x, y0, w, y1, r = 4) {
  const h = y0 - y1; if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;

function barPath(x0, y, x1, h, r = 4) {
  const w = x1 - x0; if (w <= 0) return '';

// stacked columns, keys bottom-up; the top segment gets the rounded end, 1px surface gaps
function stackedColumns(el, rows, keys, colors, names, opt = {}) {
  const w = W(el), h = opt.h || 300, m = { t: opt.mt || 14, r: 8, b: 26, l: opt.ml || 44 };
  const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const x = d3.scaleBand().domain(rows.map(r => r.y)).range([0, iw]).padding(opt.pad == null ? 0.25 : opt.pad);
  const tot = r => keys.reduce((s, k) => s + (r[k] || 0), 0);
  const y = d3.scaleLinear().domain([0, opt.max || d3.max(rows, tot)]).nice().range([ih, 0]);
  const back = g.append('g');
  yAxis(g, y, iw, opt.ticks || 5, opt.yf);
  const bw = Math.min(opt.bw || 24, x.bandwidth());
  rows.forEach(r => {
    let acc = 0; const segs = keys.map((k, i) => ({ k, i, v: r[k] || 0 })).filter(s => s.v > 0);
    const gx = x(r.y) + (x.bandwidth() - bw) / 2;
    segs.forEach((s, j) => {
      const y0 = y(Math.min(acc, y.domain()[1])), y1 = y(Math.min(acc + s.v, y.domain()[1])); acc += s.v;
      const gap = j ? 1 : 0, top = j === segs.length - 1;
      const yy0 = y0 - gap, yy1 = top ? y1 : y1 + 1;
      if (yy0 - yy1 < 0.5) return;
      g.append('path').attr('d', top ? colPath(gx, yy0, bw, yy1, Math.min(4, bw / 3)) : `M${gx},${yy0}V${yy1}H${gx + bw}V${yy0}Z`).attr('fill', colors[s.i]).attr('opacity', opt.partial && opt.partial(r) ? 0.55 : 1);
    });
    if (opt.topLabel && tot(r)) g.append('text').attr('class', 'lbl').attr('x', gx + bw / 2).attr('y', y(Math.min(tot(r), y.domain()[1])) - 5).attr('text-anchor', 'middle').text(opt.topLabel(r));
  });
  g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
  const every = opt.every || Math.ceil(rows.length / Math.max(4, Math.floor(iw / 44)));
  rows.forEach((r, i) => { if ((opt.tick ? opt.tick(r) : i % every === 0) || (!opt.tick && i === rows.length - 1 && (rows.length - 1) % every >= every / 2)) g.append('text').attr('class', 'lbl').attr('x', x(r.y) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(opt.xf ? opt.xf(r.y) : r.y); });
  bindTip(g.selectAll('.hit').data(rows).join('rect').attr('class', 'hit').attr('x', r => x(r.y)).attr('width', x.bandwidth()).attr('y', 0).attr('height', ih),
    opt.tipf || (r => `<b>${opt.xf ? opt.xf(r.y) : r.y}${opt.partial && opt.partial(r) ? ' (' + t('partial') + ')' : ''}</b>` + keys.map((k, i) => (r[k] ? trow(colors[i], names[i], fmt(r[k]) + (opt.noShare ? '' : ` · ${pct(r[k], tot(r))}`)) : '')).reverse().join('') + trow(null, t('total'), fmt(tot(r)))));
  return { svg, g, back, x, y, iw, ih, bw, m };
}
// rows of 100% bands with rounded ends and the shares inside
function bands(el, rows, keys, colors, names, opt) {
  const w = W(el), nw = narrow(w), rowH = opt.rowH || 34, m = { t: 4, r: nw ? (opt.rn || 58) : (opt.r || 86), b: 22, l: nw ? (opt.ln || 52) : (opt.l || 90) };
  const h = m.t + m.b + rowH * rows.length, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, 1]).range([0, iw]);
  [0, .25, .5, .75, 1].forEach(v => g.append('text').attr('class', 'lbl mut').attr('x', x(v)).attr('y', rowH * rows.length + 14).attr('text-anchor', 'middle').text(pv(100 * v)));
  const id0 = 'bd' + (++HATCH);
  rows.forEach((r, i) => {
    const y0 = i * rowH + 6, bh = rowH - 12, tot = sum(keys, k => r[k] || 0), id = id0 + '_' + i;
    if (!tot) return;
    g.append('clipPath').attr('id', id).append('rect').attr('x', 0).attr('y', y0).attr('width', iw).attr('height', bh).attr('rx', bh / 2);
    const row = g.append('g').attr('clip-path', `url(#${id})`).attr('opacity', opt.partial && opt.partial(r) ? .55 : 1);
    let acc = 0;
    keys.forEach((k, j) => {
      const v = r[k] || 0; if (!v) return;
      const x0 = x(acc / tot), x1 = x((acc + v) / tot); acc += v;
      row.append('rect').attr('x', x0).attr('width', Math.max(0, x1 - x0 - (acc < tot ? 1.5 : 0))).attr('y', y0).attr('height', bh).attr('fill', colors[j]);
      if (x1 - x0 > 34) row.append('text').attr('class', 'lbl').attr('x', (x0 + x1) / 2).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'middle')
        .style('fill', (opt.light || []).includes(j) ? css('--text') : '#fff').style('pointer-events', 'none').text(pct(v, tot));
    });
    g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text(opt.label(r, nw));
    g.append('text').attr('class', 'lbl strong').attr('x', iw + 10).attr('y', y0 + bh / 2 + 4).text(opt.right(r, nw));
    bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', i * rowH).attr('height', rowH).datum(r),
      d => `<b>${esc(opt.label(d, false))}</b>` + keys.map((k, j) => d[k] ? trow(colors[j], names[j], `${fmt(d[k])} · ${pct(d[k], tot)}`) : '').join('') + (opt.tipExtra ? opt.tipExtra(d) : trow(null, t('total'), fmt(tot))));
  });
  return { svg, g, iw };
}
// a list of horizontal bars, each with its label above it
function barList(el, rows, opt) {
  const w = W(el), rowH = opt.rowH || 32, m = { t: 2, r: 44, b: 4, l: 0 };
  const svg = svgIn(el, w, m.t + m.b + rowH * rows.length), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, opt.max || d3.max(rows, opt.v)]).range([0, iw]);
  rows.forEach((r, i) => {
    const cy = i * rowH;

    g.append('path').attr('d', barPath(0, cy + 17, Math.max(2, x(opt.v(r))), 9, 3)).attr('fill', opt.color(r));
    g.append('text').attr('class', 'lbl').attr('x', Math.max(2, x(opt.v(r))) + 6).attr('y', cy + 25).text(fmt(opt.v(r)));
    bindTip(g.append('rect').attr('class', 'hit').attr('x', 0).attr('width', w).attr('y', cy).attr('height', rowH).datum(r), opt.tip);
  });

}

          g.append('path').attr('d', last ? barPath(x0, y0, x1, bh, 4) : `M${x0},${y0}h${Math.max(0.6, x1 - x0 - 1)}v${bh}h${-Math.max(0.6, x1 - x0 - 1)}Z`).attr('fill', colors[j]).attr('opacity', r.d === 2020 ? .6 : 1);

          d => `<b>${decName(d.d)}</b>` + keys.map((k, j) => trow(colors[j], names[j], `${fmt(d[k] || 0)} · ${pct(d[k] || 0, tot(d))}`)).join('') + trow(null, t('total'), fmt(tot(d))));

part('p4', 'IV. Yürütme, Resmî Gazete ve belediyeler', 'IV. The executive, the Resmî Gazete and municipalities',
  `Resmî Gazete'nin 2001'den bu yana günlük fihristi (data/rg-*.csv, data/rg-index/; ilanlar hariç, 2017–2020 depoda yok) ve büyükşehir belediye meclislerinin kararları (local/).`,
  'The daily index of the Resmî Gazete since 2001 (data/rg-*.csv, data/rg-index/; notices left out, 2017–2020 not held) and the decisions of metropolitan councils (local/).');

  ['bkk', 'Bakanlar Kurulu kararları', 'Council of Ministers decisions'], ['cbkarar', 'Cumhurbaşkanı kararları', 'Presidential decisions'], ['reg', 'Yönetmelikler (üniversiteler dışında)', 'Regulations (not universities)'],

  ['appoint', 'Atama ve vekâlet', 'Appointments and acting'], ['court', 'Yargı kararları', 'Court decisions'], ['other', 'Diğer (TBMM kararları, genelgeler…)', 'Other (Assembly decisions, circulars…)']];
const rgYears = c => { const y0 = c.years[0], y1 = c.years[c.years.length - 1]; return d3.range(y0, y1 + 1); };

  return {

      `Every item in the daily index (notices left out), by kind; each row is shaded against its own highest value. ${fmt(v(lastB, 'bkk'))} Council of Ministers decisions were published in ${lastB}; since ${firstC} there have been ${fmt(d3.min(cy0, y => v(y, 'cbkarar')))}–${fmt(d3.max(cy0, y => v(y, 'cbkarar')))} presidential decisions a year. The last decree-laws (KHK) in the index are of ${lastK} (${fmt(v(lastK, 'khk'))}); since ${firstC} there have been ${fmt(d3.min(cy0, y => v(y, 'cbk')))}–${fmt(d3.max(cy0, y => v(y, 'cbk')))} presidential decrees (CBK) a year. 2017–2020 are not in the repository.`),

      legend(el, [0.15, 0.5, 1].map(q => ({ c: ramp(0.12 + 0.88 * Math.sqrt(q)), l: q === 1 ? L('satırın en yüksek yılı', 'the row\'s highest year') : pv(100 * q) })).concat([{ c: css('--surface-2'), l: L('depoda yok', 'not in the repository'), shape: 'hatch' }]));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`), hu = hatch(svg);
      YRS.forEach((y, j) => { if (y % 5 === 1 || y === LY) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', -7).attr('text-anchor', 'middle').text(nw ? `’${String(y).slice(2)}` : y); });
      const tots = RGT.map(([k]) => sum(YRS.filter(has), y => v(y, k))), xb = d3.scaleLinear().domain([0, d3.max(tots)]).range([0, m.r - (nw ? 6 : 34)]);
      RGT.forEach(([k, tr, en], i) => {
        const cy = i * rowH, mx = d3.max(YRS.filter(has), y => v(y, k)) || 1;
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').text(L(tr, en));

        g.append('text').attr('class', 'lbl').attr('x', iw + (nw ? 4 : 12) + (nw ? 0 : xb(tots[i]))).attr('y', cy + 15).text(nw && tots[i] >= 10000 ? dec(tots[i] / 1000, 0) + L(' bin', 'k') : fmt(tots[i]));
      });
      note(el, ['data/rg-*.csv', 'data/rg-index/m8-years-2of8/', 'data/rg-index/m8-years-5of8/'], fmt(PF.rg_items) + L(' yazı', ' items'),
        L(`tür, fihristteki bölüm başlığından, başlık yoksa yazının adından okunur (kurallar src/prep.py'de); iki kaynakta da geçen yazılar bir kez sayıldı. Sağdaki sayı depodaki yılların toplamıdır. ${LY}, ${dateTxt(c.last)} tarihine kadardır.`,

      YRS.forEach(yy => { if (yy % 5 === 1 || yy === LY) g.append('text').attr('class', 'lbl').attr('x', x(yy) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(yy); });

        L(`üniversite yönetmeliği: adında “Üniversitesi” ya da “Yüksek Teknoloji Enstitüsü” geçen yönetmelik; YÖK'ün yönetmelikleri dahil değil. Tür, fihristin bölüm başlığından okunur. ${LY} eksik yıldır.`,
          `a university regulation is one whose name contains "Üniversitesi" or "Yüksek Teknoloji Enstitüsü"; the Council of Higher Education's own regulations are not included. The kind is read from the index's section heading. ${LY} is partial.`));
      table(el, [t('year'), L('Yönetmelik', 'Regulations'), L('Üniversite', 'University'), L('Araştırma merkezi', 'Research centre'), t('share')], c.map(r => [String(r.y), r.all, r.univ, r.centre, pct(r.univ, r.all)]));
    }
  };
});

const LOCN = { zoning: ['İmar planları', 'Zoning plans'], property: ['Taşınmaz (satış, tahsis, devir)', 'Property (sale, allocation, transfer)'], budget: ['Bütçe ve mali işler', 'Budget and finance'],
  fees: ['Ücret ve tarifeler', 'Fees and tariffs'], transport: ['Ulaşım ve trafik', 'Transport and traffic'], org: ['Kurum, şirket ve personel', 'Administration, companies and staff'],

const CITY = { bursa: 'Bursa', mersin: 'Mersin', tekirdag: 'Tekirdağ' };
chart('c17', el => {
  const c = D.c17, keys = Object.keys(LOCN), cities = ['bursa', 'mersin', 'tekirdag'];
  const rows = cities.map(k => { const o = { k, ...c[k] }; o.social = (o.social || 0) + (o.naming || 0); o.yrs = Object.keys(c[k]).filter(q => q.startsWith('_years_')).map(q => +q.slice(7)).sort(); return o; });
  const tot = r => sum(keys, k => r[k] || 0), all = { k: 'all', yrs: [] }; keys.forEach(k => all[k] = sum(rows, r => r[k] || 0));
  const Z = sum(rows, r => r.zoning || 0), T = sum(rows, tot);
  return {
    title: L(`Büyükşehir meclisleri: kararların ${nS(pct(Z, T), 'poss')} imar planlarıyla ilgili`, `Metropolitan councils: ${pct(Z, T)} of decisions concern zoning plans`),
    dek: L(`Üç büyükşehir belediye meclisinin başlığı olan kararları, başlıktaki sözcüklere göre. İmar planı değişiklikleri, plan notları ve plan itirazları Bursa'da kararların ${nS(pct(rows[0].zoning, tot(rows[0])), 'poss')}, Mersin'de ${nS(pct(rows[1].zoning, tot(rows[1])), 'poss')}, Tekirdağ'da ${nS(pct(rows[2].zoning, tot(rows[2])), 'poss')}.`,
      `The titled decisions of three metropolitan councils, by words in their titles. Zoning plan changes, plan notes and objections to plans are ${pct(rows[0].zoning, tot(rows[0]))} of decisions in Bursa, ${pct(rows[1].zoning, tot(rows[1]))} in Mersin and ${pct(rows[2].zoning, tot(rows[2]))} in Tekirdağ.`),
    draw(el) {
      const cols = S8(), colors = [cols[0], cols[3], cols[2], cols[4], cols[6], cols[5], cols[1], css('--muted-mark')];
      legend(el, keys.map((k, i) => ({ c: colors[i], l: L(...LOCN[k]) })));
      const span = r => r.yrs.length ? (r.yrs[0] === r.yrs[r.yrs.length - 1] ? `${r.yrs[0]}` : `${r.yrs[0]}–${r.yrs[r.yrs.length - 1]}`) : '';
      bands(el, rows.concat([all]), keys, colors, keys.map(k => L(...LOCN[k])), { rowH: 40, l: 130, ln: 76, r: 112, rn: 50, light: [7],
        label: (r, nw) => r.k === 'all' ? L('Üçü birlikte', 'All three') : nw ? CITY[r.k] : `${CITY[r.k]} · ${span(r)}`, right: (r, nw) => nw ? fmt(tot(r)) : L(`${fmt(tot(r))} karar`, `${fmt(tot(r))} decisions`) });

        L(`konu, başlıktaki sözcüklerden okunur (imar, plan, UİP, ada/parsel; satış, tahsis, devir…; kurallar src/prep.py'de); taşınmaz kuralı imar kuralından önce gelir. Başlığı olmayan kararlar sayılmadı (Bursa ${fmt(D.c17_total.bursa - tot(rows[0]))}); Ankara'nın ${fmt(D.c17_total.ankara)} kararı başlıksız olduğundan yok. Dönemler farklıdır: depodaki karar yılları.`,

part('p5', 'V. Anayasa Mahkemesi', 'V. The Constitutional Court',
  'Yayıncının yürürlük tablolarında kanunları değiştiren olarak kayıtlı kararlar (data/in-force-list.csv) ve Mahkemenin karar bilgi bankasındaki bireysel başvuru kararlarının dizini (data/aym-individual-*.csv).',
  'The decisions recorded as changing laws in the publisher\'s in-force tables (data/in-force-list.csv), and the index of the Court\'s individual-application decisions in its decisions database (data/aym-individual-*.csv).');

chart('c18', el => {
  const c = D.c18, dec0 = c.dec.filter(d => d.y), N = dec0.length, Df = dec0.filter(d => d.def).length, a0 = c.acts[0];
  const Y0 = 2003, LY = +PF.built.slice(0, 4), yrs = d3.range(Y0, LY + 1).map(y => ({ y, now: dec0.filter(d => d.y === y && !d.def).length, def: dec0.filter(d => d.y === y && d.def).length }));
  const early = dec0.filter(d => d.y < Y0).length;
  return {
    title: L(`Anayasa Mahkemesi: yürürlük tablolarında ${fmt(N)} karar; bunların ${nS(pct(Df, N), 'possloc')} iptal aylar sonra yürürlüğe girdi`, `The Constitutional Court: ${fmt(N)} decisions in the in-force tables; in ${pct(Df, N)} the annulment took effect months later`),
    dek: L(`Yayıncının yürürlük tablolarında bir kanunu ya da KHK'yi değiştiren olarak kayıtlı Anayasa Mahkemesi kararları, karar yılına göre. ${fmt(Df)} kararda iptal, kararın yayımından aylar sonra yürürlüğe girdi (tabloda “yayımlanmasından başlayarak dokuz ay sonra” gibi). Sağda, en çok karar düşen düzenlemeler: ilk sırada ${actName(a0[0], a0[2])} (${fmt(a0[1])} karar).`,
      `Constitutional Court decisions recorded in the publisher's in-force tables as changing a law or decree-law, by year of decision. In ${fmt(Df)} the annulment took effect months after the decision was published (the table says, for example, "nine months after its publication"). Right: the acts most often changed, led by the ${actName(a0[0], a0[2])} (${fmt(a0[1])} decisions).`),
    draw(el) {
      const cols = S8(), keys = ['now', 'def'], colors = [cols[6], cols[3]], names = [L('Yayımla birlikte ya da kısa sürede', 'At publication or soon after'), L('Aylar sonra (ertelenmiş)', 'Months later (deferred)')];
      const box = el.append('div').attr('class', 'mini');
      const pa = box.append('div'), pb = box.append('div');
      pa.append('h4').text(L('Karar yılına göre', 'By year of decision'));
      legend(pa, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      stackedColumns(pa, yrs, keys, colors, names, { h: 240, pad: 0.2, partial: r => r.y === LY, tick: r => r.y % 5 === 0 });
      pb.append('h4').text(L('En çok karar düşen düzenlemeler', 'The acts most often changed'));
      pb.append('p').text(L('karar sayısı', 'number of decisions'));
      barList(pb, c.acts.slice(0, 10), { rowH: 30, v: r => r[1], color: () => cols[6], label: r => actName(r[0], r[2]),
        tip: r => `<b>${esc(actName(r[0], r[2]))}</b>` + trow(null, L('Karar', 'Decisions'), fmt(r[1])) + trow(null, L('Kabul / yayım', 'Passed / published'), (r[3] || '').slice(0, 4)) });
      note(el, ['data/in-force-list.csv'], fmt(N) + L(' karar', ' decisions'),
        L(`karar, tablodaki “Anayasa Mahkemesinin … tarihli ve E: …, K: … sayılı Kararı” satırlarından, karar numarasına göre birleştirildi (${fmt(c.rows)} satır). Ertelenmiş: tablodaki yürürlük metni “… ay sonra” ya da “… yıl sonra” diyor. Tablolar yayıncının tuttuğu 717 düzenlemeyi kapsar; daha önce yürürlükten kalkan kanunlardaki iptaller burada yok. ${Y0} öncesi ${fmt(early)} karar tabloda.`,
          `the decisions are gathered from rows such as "Anayasa Mahkemesinin … tarihli ve E: …, K: … sayılı Kararı" by decision number (${fmt(c.rows)} rows). Deferred: the table's in-force text reads "… months later" or "… years later". The tables cover the 717 acts the publisher keeps them for; annulments in laws repealed since are not here. ${fmt(early)} decisions before ${Y0} are in the table.`));
      table(el, [L('Karar', 'Decision'), L('Tarih', 'Date'), L('Düzenleme', 'Acts'), L('Ertelenmiş', 'Deferred')], c.dec.slice().sort((a, b) => (a.d || '').localeCompare(b.d || '')).map(d => [d.k, d.d || '', d.n, d.def ? L('evet', 'yes') : '']));
    }
  };
});

chart('c19', el => {
  const c = D.c19, keys = ['viol', 'noviol', 'inadm', 'unknown'], tot = r => sum(keys, k => r[k] || 0), known = r => (r.viol || 0) + (r.noviol || 0) + (r.inadm || 0);
  const V = sum(c, r => r.viol || 0), K = sum(c, known), U = c.filter(r => r.unknown), LY = d3.max(c, r => r.y), N = sum(c, tot);
  return {
    title: L(`Bireysel başvuru: sonucu kayıtlı kararların ${nS(pct(V, K), 'possloc')} hak ihlali bulundu`, `Individual applications: a violation was found in ${pct(V, K)} of decisions with a recorded outcome`),
    dek: L(`Anayasa Mahkemesinin karar bilgi bankasında yayımlanan ${fmt(N)} bireysel başvuru kararı, karar yılına ve sonuca göre. Sütunun üstünde ihlal kararlarının payı. ${U[0].y}–${U[U.length - 1].y} kararlarının sonucu dizinde yok (gri).`,
      `The ${fmt(N)} individual-application decisions published in the Constitutional Court's decisions database, by year of decision and outcome. Above each column, the share finding a violation. The outcome of the decisions of ${U[0].y}–${U[U.length - 1].y} is not in the index (grey).`),
    draw(el) {
      const cols = S8(), colors = [cols[7], cols[0], css('--muted-mark'), css('--surface-2')];
      const names = [L('İhlal', 'Violation'), L('İhlal olmadığı', 'No violation'), L('Kabul edilemezlik vb.', 'Inadmissible and similar'), L('Sonuç dizinde yok', 'Outcome not in the index')];
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      const s = stackedColumns(el, c, keys, colors, names, { pad: 0.25, bw: 40, partial: r => r.y === LY, h: 290, topLabel: r => known(r) ? pct(r.viol || 0, known(r)) : '' });
      c.filter(r => r.unknown).forEach(r => { const gx = s.x(r.y) + (s.x.bandwidth() - s.bw) / 2, y1 = s.y(r.unknown);
        s.g.append('path').attr('d', colPath(gx, s.ih, s.bw, y1, 4)).attr('fill', 'none').attr('stroke', css('--muted-mark')).attr('stroke-dasharray', '3 2'); });
      note(el, ['data/aym-individual-*.csv'], fmt(N) + L(' karar', ' decisions'),
        L(`sonuç, dizinin sonuç alanından ya da kaydın üst verisinden (kararTuruBasvuruSonucuLabel) okunur. Bu, Mahkemenin yayımladığı kararlardır; kabul edilemezlik kararlarının çoğu yayımlanmaz, bu yüzden oranlar tüm başvuruları değil yayımlanan kararları anlatır. ${LY} eksik yıldır.`,
          `the outcome is read from the index's outcome field or the record's metadata (kararTuruBasvuruSonucuLabel). These are the decisions the Court publishes; most inadmissibility decisions are not published, so the shares describe published decisions, not all applications. ${LY} is partial.`));
      table(el, [t('year'), ...names, t('total')], c.map(r => [String(r.y), ...keys.map(k => r[k] || 0), tot(r)]));
    }
  };
});

    }
  };
});

const ctryName = k => L(...(CTRY[k] || [k, k]));
const ctrySent = k => LANG === 'en' && ['US', 'GB', 'NL', 'PH', 'AE', 'KKTC', 'DO', 'CI'].includes(k) ? 'the ' + ctryName(k) : ctryName(k);
let WORLD = null, WORLD_P = null;
const worldAtlas = () => WORLD_P || (WORLD_P = fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()).then(j => (WORLD = j)));

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'c16', 'p2', 'c05', 'c06', 'c07', 'p3', 'c08', 'c09', 'c10', 'c11', 'c12', 'p4', 'c13', 'c14', 'c15', 'c17', 'p5', 'c18', 'c19', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Git geçmişi (tüm commit\'ler)', 'Git history (every commit)'), 'git log origin/main', fmt(P.commits), L(`son commit ${P.last_commit_date}`, `last commit ${P.last_commit_date}`), L('commit tarihi yürürlük, karar ya da yayım günüdür; 1970 öncesi 1970 tarihlidir', 'a commit is dated the day its text took effect or a decision was given or published; before 1970 dated 1970')],
    [L('Kanun dizini', 'Law index'), 'data/m4-all/', `${fmt(P.law_index_rows)} (${fmt(P.law_index)} ${L('tekil', 'distinct')})`, `1921–${P.law_last.slice(0, 4)}`, L(`${fmt(P.law_dupes)} satır iki kez geçiyor; tarihi olmayan kanunlar ve VETO numaraları yıllara girmez`, `${fmt(P.law_dupes)} rows are listed twice; undated laws and VETO numbers have no year`)],
    [L('Değişiklik notları', 'Amendment notes'), 'data/amendments.csv', fmt(P.amend_notes), L('yürürlükteki kanun ve KHK metinleri', 'the texts of laws and decree-laws in force'), L('yeniden değişen hükümlerin eski notları yok', 'provisions changed again have lost their older notes')],
    [L('Yürürlük tabloları', 'In-force tables'), 'data/in-force-list.csv', fmt(P.inforce_rows), L('yayıncının tablo tuttuğu 717 düzenleme', 'the 717 acts the publisher keeps tables for'), L('kaldırılmış kanunlar yok', 'repealed laws are not covered')],
    [L('Anayasa', 'Constitution'), 'law/1982/2709/', fmt(P.constitution_files) + L(' madde dosyası', ' article files'), L('bugünkü metin ve değişiklik notları', 'the current text and its notes'), ''],
    [`Resmî Gazete ${L('fihristi', 'index')}`, 'data/rg-*.csv, data/rg-index/', `${fmt(P.rg_items)} ${L('yazı', 'items')} · ${fmt(P.rg_days)} ${L('gün', 'days')}`, `2001–2016, 2021–${P.rg_last.slice(0, 4)}`, L('2017–2020 depoda yok; ilanlar sayılmadı', '2017–2020 not held; notices left out')],
    [L('Genel Kurul tutanak dizini', 'Plenary minutes index'), 'data/minutes-*.csv', fmt(P.minutes), `1920–${P.built.slice(0, 4)}`, L('15. ve 16. dönem (1973–1980) yok', 'terms 15 and 16 (1973–1980) missing')],
    [L('Meclis kararları', 'Assembly decisions'), 'parliament-decision/', `${fmt(P.tbmm_decisions)} (${fmt(P.tbmm_decisions_titled)} ${L('başlıklı', 'titled')})`, '1983–' + P.built.slice(0, 4), L('başlıksız kararlar yalnızca üst veri', 'untitled decisions are metadata only')],
    [L('Belediye meclisi kararları', 'Council decisions'), 'local/', fmt(P.councils), L('Ankara, Bursa, Mersin, Tekirdağ (2017–2026)', 'Ankara, Bursa, Mersin, Tekirdağ (2017–2026)'), L('Ankara kararları başlıksız', 'Ankara\'s decisions have no titles')],
    [L('Bireysel başvuru dizini', 'Individual-application index'), 'data/aym-individual-*.csv', fmt(P.aym_individual), '2013–2026', L('2021–2024 sonucu yok; yalnızca yayımlanan kararlar', 'no outcome for 2021–2024; published decisions only')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    let room = null;
    if (this.getAttribute('data-fit')) room = +this.getAttribute('data-fit');
    else if (this.getAttribute('text-anchor') === 'end' && +this.getAttribute('x') < 0) room = this.getBoundingClientRect().right - this.ownerSVGElement.getBoundingClientRect().left - 2;
    if (room == null || this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG === 'tr' ? 'tr' : 'en';
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  d3.select('[data-theme-set="auto"]').text(L('Oto', 'Auto'));
  const tl = t('tiles'), tv = [PF.commits, PF.law_index_rows, PF.amend_notes, PF.rg_items, PF.minutes, PF.aym_individual];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.tr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dtr, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.tr, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(':')[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', PF.built + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('tr-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('tr-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
