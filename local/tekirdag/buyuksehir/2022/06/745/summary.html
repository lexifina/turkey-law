<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, İsmetpaşa Mahallesi, 1548 ada 1 parsele ilişkin 1/1000 Ölçekli Uygulama İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
