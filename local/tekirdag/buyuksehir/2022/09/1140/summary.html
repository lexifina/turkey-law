<p style="text-align: justify;">Marmaraereğlisi Belediye Başkanlığının Ek Bütçe ile ilgili almış olduğu 06.09.2022 tarih ve 156 sayılı Meclis Kararı Belediyemize iletilmiş olup, Büyükşehir Belediye Meclisinden onaylanması talebinin Plan ve Bütçe Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
