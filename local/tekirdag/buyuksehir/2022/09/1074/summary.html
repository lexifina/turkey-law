<p style="text-align: justify;">İlimiz, Çorlu ilçesi, Hatip Mahallesi, 2072 ada 3 parsel ve tescil dışı alana ilişkin 1/1000 ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
