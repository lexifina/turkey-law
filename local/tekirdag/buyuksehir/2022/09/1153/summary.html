<p style="text-align: justify;">Çerkezköy Belediye Başkanlığının Ek Bütçe ile ilgili almış olduğu 05.09.2022 tarih ve 111 sayılı Meclis Kararı Belediyemize iletilmiş olup, Büyükşehir Belediye Meclisinden onaylanması talebinin Plan ve Bütçe Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
