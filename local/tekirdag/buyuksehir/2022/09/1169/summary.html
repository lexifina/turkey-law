<p style="text-align: justify;">İlimiz, Şarköy ilçesi, Mürefte Mahallesi, 299 ada 42 parselde kayıtlı taşınmaza ilişkin hazırlanan 1/1000 Ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
