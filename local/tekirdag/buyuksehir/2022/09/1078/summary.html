<p style="text-align: justify;">Polisevi Bahçesinin önündeki alana (Atatürk Bulvarının polis evi parselinin sınırları arasında kalan kısımda) park eden resmi araç ve polisevi misafirlerinin araçlarından ücret alınmaması talebinin Plan ve Bütçe Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
