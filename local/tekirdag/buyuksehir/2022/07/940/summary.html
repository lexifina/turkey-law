<p style="text-align: justify;">İlimiz, Çerkezköy ilçesi, İstasyon Mahallesi, 1591 ada 7 parsele ilişkin&nbsp;1/1000 ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
