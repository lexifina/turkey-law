<p style="text-align: justify;">İlimiz, Saray İlçesi, Göçerler Mahallesi, 108 ada 2 no.lu parselde &#39;Depo&#39; yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki&nbsp;İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
