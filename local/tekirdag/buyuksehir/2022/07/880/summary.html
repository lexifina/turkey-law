<p style="text-align: justify;">Şarköy ilçesi, Tepeköy Mahallesi ve Eriklice Mahallesi arasında gidiş dönüş için kullanılan yolun (Tepeköy Caddesi) Büyükşehir Belediyemiz yetki ve sorumluluk alanına alınmasının talebin İmar ve Bayındırlık Komisyonu ile Plan ve Bütçe Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
