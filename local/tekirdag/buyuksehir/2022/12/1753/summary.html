<p style="text-align: justify;">İlimiz, Şarköy ilçesi, Mürefte Mahallesi, 244 ada 1 parselde kayıtlı taşınmaza ilişkin hazırlanan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
