<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Yavuz (Vatan) Mahallesi, 1461 ada 166 ve 175 parsele ilişkin sunulan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
