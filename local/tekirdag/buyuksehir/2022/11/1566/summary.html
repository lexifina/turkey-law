<p style="text-align: justify;">İlimiz, Çorlu İlçesi, Muhittin Mahallesi, 1614 ada 3 parsele ilişkin sunulan 1/5000 ölçekli Nazım İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
