<p>İlimiz, Marmaraereğlisi ilçesi Yeniçiftlik Mahallesi, 2094 parselle ilgili olarak yapılan askı itirazlarına ilişkin, 1/5000 ölçekli Nazım İmar Planı ve 1/1000 ölçekli Uygulama İmar Planı askı itirazı talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.&nbsp;</p>
