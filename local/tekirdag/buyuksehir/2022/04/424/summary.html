<p style="text-align: justify;">Mülkiyeti Büyükşehir Belediyesine ait Süleymanpaşa ilçesi Vatan Mahallesi, Barbaros Caddesi, Dış Kapı No:8 adresindeki ''Su Ürünleri Toptan Satış Hali''nin bulunduğu alanın içkili yer bölgesine alınması talebinin Çevre ve Sağlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
