<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Kaşıkçı Mahallesi, 1808 parsel numaralı taşınmaza ilişkin hazırlanan 1/5000 ölçekli Nazım İmar Planının 5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
