<p style="text-align: justify;">İlimiz, Çerkezköy ilçesi, Gazi Mustafa Kemal Paşa Mahallesi, 44 ada 3, 4 ve 15 parsele ilişkin 1/1000 ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
