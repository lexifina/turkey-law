<p style="text-align: justify;">İlimiz, &nbsp;Kapaklı İlçesi, Karaağaç Mahallesi, 188 ada 16 no.lu parselde &#39;Depo&#39; yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki&nbsp;İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
