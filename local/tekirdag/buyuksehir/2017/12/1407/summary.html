<p style="text-align: justify;">Mahalli İdareler Bütçe ve Muhasebe Yönetmeliğinin 36. Maddesine istinaden ekteki cetvelde belirtilen ödenekler arasında aktarım yapılması talebinin kabulüne oybirliği ile karar verilmiştir. Şeklindeki Plan ve Bütçe Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
