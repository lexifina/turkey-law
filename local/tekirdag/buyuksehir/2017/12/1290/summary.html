<p style="text-align: justify;">İlimiz, Çorlu İlçesi, Muhittin Mahallesi, 1620 ada 7 nolu parsele ilişkin 1/1000 ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
