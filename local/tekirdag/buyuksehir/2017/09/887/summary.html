<p style="text-align: justify;">İlimiz, Çerkezköy İlçesi, İstasyon Mahallesi, 1590 ada 3 parsel ve 1591 ada 3 ve 6 parsele ilişkin&nbsp;1/5000 ölçekli Nazım İmar Planı değişikliğine ilişkin 1/1000 Ölçekli Uygulama İmar Planı değişikliği talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
