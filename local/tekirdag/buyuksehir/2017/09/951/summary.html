<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, Cumhuriyet Mahallesi, 494 ada 2 parsel numaralı taşınmaza ilişkin 1/1000 Ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
