<p style="text-align: justify;">İlimiz, Hayrabolu ilçesi, Kahya Mahallesi, 425 ada 79 parselde kayıtlı taşınmaza ilişkin sunulan 1/1000 Ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
