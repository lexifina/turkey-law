<p style="text-align: justify;">&nbsp;İlimiz, Saray İlçesi, Kemalpaşa Mahallesi, 148 ada 17 parsel numarasında kayıtlı taşınmaza ilişkin hazırlanan 1/5000 ölçekli Nazım İmar Planının, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
