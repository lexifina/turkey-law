<p style="text-align: justify;">İlimiz, Saray İlçesi, Ayaspaşa Mahallesi, 95 ada 22 parsel numarasında kayıtlı için hazırlanan 1/5000 ölçekli Nazım İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
