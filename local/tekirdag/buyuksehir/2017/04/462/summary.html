<p style="text-align: justify;">İlimiz, Çorlu ilçesi, Muhittin Mahallesi, 1870 ada 3 ve 4 numaralı parsele ilişkin hazırlanan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
