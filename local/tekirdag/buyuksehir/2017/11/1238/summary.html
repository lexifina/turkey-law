<p style="text-align: justify;">İlimiz Ergene İlçesi, Velimeşe Mahallesi, 697 ada, 7 nolu parselde "Depo" yapılmak için yer seçimi talebi ile ilgili Komisyon çalışmalarının devamına oybirliği ile karar verilmiştir. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
