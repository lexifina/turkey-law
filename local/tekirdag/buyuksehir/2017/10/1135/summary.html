<p style="text-align: justify;">İlimiz, Ergene İlçesi, Velimeşe Mahallesi, 702 ada, 2 nolu parselde "Depo" yapımı için yer seçimi talebi ile ilgili Komisyon çalışmalarının devamına oybirliği ile karar verilmiştir. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
