<p style="text-align: justify;">&nbsp;İlimiz, Çorlu ilçesi, Muhittin (Zafer) Mahallesi, 2494 ada 1 parsel numaralı mülkiyeti maliye hazinesine ait olan taşınmaza ilişkin hazırlanan 1/1000 ölçekli Uygulama İmar Planı değişikliğine itiraz talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
