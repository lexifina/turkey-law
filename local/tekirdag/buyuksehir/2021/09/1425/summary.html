<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Selçuk Mahallesi, 1788 parsel sayılı taşınmaza ilişkin sunulan 1/5000 ölçekli Nazım İmar Planının 5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
