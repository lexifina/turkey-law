<p style="text-align: justify;">İlimiz, Saray İlçesi, Sefaalan Mahallesi, 141 ada 28 ve 69 parseller ile Civarına ilişkin sunulan 1/25000 Ölçekli İl Çevre Düzeni Planı değişikliğinin 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
