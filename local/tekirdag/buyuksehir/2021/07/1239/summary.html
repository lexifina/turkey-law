<p style="text-align: justify;">İlimiz, Hayrabolu ilçesi, Kahya Mahallesi, 70 ada 6 parsel numaralı taşınmaza ilişkin sunulan 1/5000 ölçekli Nazım İmar Planının Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
