<p style="text-align: justify;">İlimiz, Süleymanpaşa İlçesi, Aydoğdu Mahallesi, 2452 ada 11 no.lu parselde &#39;Depo&#39; yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki&nbsp;&nbsp;İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
