<p style="text-align: justify;">İlimiz, Çerkezköy İlçesi, Veliköy Mahallesi, 470 ada 13 no.lu parselde &#39;Depolama&#39; yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki&nbsp;İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
