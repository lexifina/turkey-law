<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, Mimarsinan (Karaağaç) Mahallesi, 562 ada 8 nolu parselde &#39;Depo&#39; yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki&nbsp;İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
