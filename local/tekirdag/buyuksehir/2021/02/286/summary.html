<p style="text-align: justify;"><em>İlimiz, Süleymanpaşa İlçesi, Aydoğdu Mahallesi, 2447 ada 17 nolu parselde &#39;Depo&#39; yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir.</em> Şeklindeki İmar ve Bayındırlık Komisyonu Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
