<p style="text-align: justify;">İlimiz, Şarköy ilçesi, İstiklal Mahallesi, 654 ada 7 parsel numaralı taşınmaza ilişkin sunulan 1/1000 Ölçekli Uygulama İmar Planının Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
