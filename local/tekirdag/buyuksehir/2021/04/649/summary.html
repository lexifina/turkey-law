<p style="text-align: justify;">İlimiz, Malkara ilçesi, Allıışık Mahallesi, 155 ada 1 parsel (eski 573 parsel) numaralı taşınmaza ilişkin sunulan 1/5000 ölçekli Nazım İmar Planının Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
