<p style="text-align: justify;">Saray İlçesinde belirtilen cadde ve sokaklarda yol kenarı parklanma yapılabilmesi için Uygulama İmar Planı Notlarına, plan notu ilave edilerek uygulama imar planı değişikliği talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
