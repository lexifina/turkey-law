<p style="text-align: justify;">İlimiz Çerkezköy İlçesi, Veliköy Mahallesi, 473 ada 6 nolu parselde depo yapılmak üzere yer seçiminin uygun olduğuna&nbsp; oybirliği ile karar verildi. Şeklindeki İmar ve Bayındırlık Komisyonu Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
