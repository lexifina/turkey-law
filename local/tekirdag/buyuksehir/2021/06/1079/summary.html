<p style="text-align: justify;">İlimiz, Çorlu ilçesi, Muhittin Mahallesi, 1659 ada 6 numaralı parsele ilişkin&nbsp;1/1000 ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
