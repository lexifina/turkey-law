<p style="text-align: justify;">İlimiz, Çorlu ilçesi, Nusratiye Mahallesi, 232 ada 7 parsel ve çevresine ilişkin sunulan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
