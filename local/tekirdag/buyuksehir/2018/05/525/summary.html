<p style="text-align: justify;">İlimiz, Marmaraereğlisi İlçesi, Sultanköy Mahallesi, Konut ve Konut Gelişme Alanını Kapsayan Revizyon-İlave Uygulama İmar Planına askı süresi içinde Gönül ETİ'nin 1869 parselle ilgili itirazının İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
