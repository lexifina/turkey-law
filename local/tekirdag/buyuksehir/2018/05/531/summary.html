<p style="text-align: justify;">İlimiz, Marmaraereğlisi İlçesi, Sultanköy Mahallesi, Konut ve Konut Gelişme Alanını Kapsayan Revizyon-İlave Uygulama İmar Planına askı süresi içinde Yusuf ORMAN&#39;ın 1859 parselle ilgili itirazının İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.&nbsp;</p>
