<p style="text-align: justify;"><em>İlimiz Kapaklı İlçesi, Fatih Mahallesi, 1. Cadde isminin "Zeytin Dalı Caddesi" olarak değiştirilmesi talebinin kabulüne oybirliği ile karar verilmiştir. </em>Şeklindeki İçişleri Komisyonu Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
