<p style="text-align: justify;">&nbsp;İlimiz, Süleymanpaşa İlçesi hudutlarında bulunan, tapuda Barbaros Mahallesi 297 ada 8 parsel numarasında kayıtlı taşınmazın cephe aldığı 20 metrelik caddenin isminin bulunmadığı tespit edildiği belirtilerek isim verilmesi talebinin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
