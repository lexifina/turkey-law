<p style="text-align: justify;">Süleymanpaşa İlçesi hudutlarında bulunan, tapuda Yavuz Mahallesi 3133 ada 3 parsel numarasında kayıtlı taşınmazın cephe aldığı 2 adet sokağın isminin bulunmadığı tespit edildiği belirtilerek isim verilmesi talebinin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
