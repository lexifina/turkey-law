<p style="text-align: justify;">İlimiz, Şarköy İlçesi, Uçmakdere Mahallesine ait (Kentsel Sit Alanı Dışı) 1/5000 ölçekli Nazım İmar Planının kabulüne oybirliği ile karar verilmiştir. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
