<p style="text-align: justify;">İlimiz, Süleymanpaşa İlçesi hudutlarında bulunan, tapuda Karaevli Mahallesi 110 ada 13 parsel numaralarında kayıtlı taşınmazların cephe aldığı sokağın isminin bulunmadığı tespit edildiği belirtilerek isim verilmesi talebinin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
