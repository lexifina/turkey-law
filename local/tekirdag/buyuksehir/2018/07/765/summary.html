<p style="text-align: justify;">İlimiz, Süleymanpaşa İlçesi hudutlarında bulunan, tapuda Kumbağ Mahallesi 2502 parsel numarasında kayıtlı taşınmazın cephe aldığı sokağın isminin bulunmadığı tespit edildiği belirtilerek isim verilmesi talebinin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
