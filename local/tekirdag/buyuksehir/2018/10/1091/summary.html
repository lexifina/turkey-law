<p style="text-align: justify;"><em>İlimiz, Şarköy İlçesi, Uçmakdere Mahallesi, Kentsel Sit Alanına ait 1/1000 ölçekli Koruma Amaçlı Uygulama İmar Planının kabulüne oybirliği ile karar verilmiştir.</em> Şeklindeki İmar ve Bayındırlık Komisyonu Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
