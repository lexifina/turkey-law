<p style="text-align: justify;">Opr.Dr. Sara YAZICI'nın, Türk Tabipler Birliğinin yayınladığı ücret tarifesine göre (01.11.2018-31.12.2018) tarihleri arasında Kısmi Süreli İş Sözleşmesi imzalanarak, haftada 5 gün Kısmi Süreli İşyeri Hekimi olarak çalıştırılması talebinin kabulüne oybirliği ile karar verilmiştir.</p>
