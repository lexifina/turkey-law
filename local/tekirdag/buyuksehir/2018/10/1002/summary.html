<p style="text-align: justify;">İlimiz, Marmaraereğlisi İlçesi, Sultanköy Mahallesi, Konut ve Konut Gelişme Alanını Kapsayan Revizyon-İlave Uygulama İmar Planına askı süresi içinde yapılan Adnan ÇOLPAN&#39;ın 1681 ve 580 parsellerle ilgili itiraz talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
