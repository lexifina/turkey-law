<p style="text-align: justify;">İlimiz, Süleymanpaşa İlçesi, Altınova Mahallesindeki Hüseyin Arıtepe Sokak ile Kazım Ayvaz Sokak arasında ve 1414 ada 15 parsel ile 1416 ada 22 parsel arasında bulunan adsız sokağa "Osman AKMAN" isminin verilmesi talebinin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
