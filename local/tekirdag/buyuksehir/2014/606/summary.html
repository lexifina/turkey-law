<p style="text-align: justify;">2015 yılında uygulanacak Ücrete Tabi İşler Tarifesinin 55. Maddesi ile ilgili komisyonumuzca belirlenen ücretlerin ekli listede önerildiği şekilde kabulüne oybirliği ile karar verilmiştir, şeklindeki Plan ve Bütçe Komisyon Raporu komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
