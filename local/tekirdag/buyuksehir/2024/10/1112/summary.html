<p style="text-align: justify;">Tekirdağ ili, Süleymanpaşa ilçesi, Barbaros Mahallesi, 159 ada 1 parsel, 817 ve 818 parsel numaralı taşınmazlara ilişkin sunulan 1/1000 ölçekli Uygulama İmar Planı değişikliği talebinin&nbsp;İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
