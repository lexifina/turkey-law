<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, Atatürk Mahallesi, 2017 ada 17 parsele ilişkin sunulan 1/5000 ölçekli Nazım İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
