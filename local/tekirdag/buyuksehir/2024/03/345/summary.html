<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, İsmetpaşa Mahallesi, 1552 ada 2 parsele ilişkin hazırlanan 1/5000 ölçekli Nazım İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
