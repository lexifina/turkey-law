<p style="text-align: justify;">Tekirdağ Meteoroloji Müdürlüğüne hemzemin geçit ile geçilerek ulaşılmakta olup, bu geçidin Meteoroloji Hemzemin Çıkmazı olarak isimlendirilmesi ve&nbsp;&nbsp;aynı güzergahta yer alan benzer çıkmaz sokaklar krokilendirilmiş olup talebin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
