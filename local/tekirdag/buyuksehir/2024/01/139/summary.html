<p style="text-align: justify;">İlimiz, Ergene İlçesi Marmaracık Mahallesinde bulunan 6. Cadde isminin &#39;Bayraklı Caddesi&#39; olarak değiştirilmesi talebinin kabulüne oybirliği ile karar verilmiştir.&nbsp;Şeklindeki İçişleri Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
