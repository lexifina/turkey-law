<p style="text-align: justify;">İlimiz, Muratlı İlçesi Ballıhoca Mahallesinde bulunan 1524.sokak isminin &#39;Muhtar Kadir AKKAVAK Sokak&#39; olarak değiştirilmesi talebinin kabulüne oybirliği ile karar verilmiştir. Şeklindeki İçişleri Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
