<p style="text-align: justify;">Tekirdağ Büyükşehir Belediye Meclisinin 13.09.2023 tarih ve 1273 Sayılı Meclis Kararının iptal edilmesi talebi ile ilgili Komisyon çalışmalarının devamına oybirliği ile karar verilmiştir. Şeklindeki Ulaşım Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
