<p style="text-align: justify;">İlimiz,Kapaklı İlçesi, Atatürk Mahallesi, 2063 ada 13 parsel ile doğusunda kalan tescilsiz alana ilişkin sunulan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin&nbsp;İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
