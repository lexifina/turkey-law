<p style="text-align: justify;">İlimiz, Çorlu ilçesi, Kazımiye Mahallesi, 1499 ada 17 numaralı parsele ilişkin&nbsp;sunulan 1/5000 ölçekli Nazım İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediye Kanunu uyarınca&nbsp;onaylanması talebinin&nbsp;İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
