<p style="text-align: justify;"><em>İlimiz, Çorlu ilçesi Hatip Mahallesi, 2064 ada 1 parselin 1/1000 ölçekli Uygulama İmar Planı değişikliğinin kabulüne oybirliği ile karar verilmiştir.</em> Şeklindeki İmar ve Bayındırlık Komisyonu Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
