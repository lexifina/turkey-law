<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, Karaağaç Mahallesi, 758 Ada, 1 nolu parselde bulunan alanda "Depo" yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
