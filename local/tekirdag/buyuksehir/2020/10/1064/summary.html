<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, Fatih (Karaağaç) Mahallesi, 192 ada 14 nolu parselde depo amaçlı yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verildi. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
