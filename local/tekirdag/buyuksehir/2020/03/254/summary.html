<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Ferhadanlı Mahallesi, 115 ada 4 parsel numaralı taşınmaza ilişkin hazırlanan 1/1000 ölçekli Uygulama İmar Planı değişikliğinin Büyükşehir Belediye Meclisinde görüşülmesi talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>
