<p style="text-align: justify;">İlimiz, Şarköy İlçesi, Cumhuriyet Mahallesi, 14 ada 8, 11, 50, 54 ve 77 no'lu parsellerin kuzeyi ile 14 ada, 33 parselin batısında bulunan isimsiz sokağa ''Yücel Paşmakçı'' isminin verilmesi talebinin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
