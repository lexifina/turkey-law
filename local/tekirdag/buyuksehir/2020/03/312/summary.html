<p style="text-align: justify;">İçişleri Komisyon Raporu doğrultusunda;&#39;&#39;İnsan Kaynakları ve Eğitim Dairesi Başkanlığı Teşkilat Yapısı, Görev, Yetki ve Sorumlulukları İle Çalışma Usul ve Esasları Hakkında Yönetmelikte Değişiklik Yapılmasına İlişkin Yönetmelik&#39;&#39;in sunulduğu şekliyle kabulüne oybirliği ile karar verilmiştir.</p>
