<p style="text-align: justify;">İlimiz, Saray İlçesi, Büyükyoncalı Mahallesi, 1343 parsel numaralı taşınmaza ilişkin 1/1000 ölçekli Uygulama İmar Planının 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
