<p style="text-align: justify;"><em>İlimiz, Ergene İlçesi, Misinli Mahallesi 1567, 1568, 1575 ve 1576 nolu parsellerin Ergene-1 OSB sınırları içerisine dahil olmasının uygun olduğuna oybirliği ile karar verilmiştir.</em> Şeklindeki&nbsp;İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
