<p style="text-align: justify;">İlimiz, Süleymanpaşa İlçesi, Çiftlikönü Mahallesi hudutlarında bulunan Soğancı Caddesi ile aynı mahallede bulunan Soğancılar Caddesinin isim benzerliği bulunduğu ve Soğancı Caddesi isminin değiştirilmesi talebinin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
