<p style="text-align: justify;">İlimiz, Ergene İlçesi, Velimeşe Mahallesi, 663 ada 10 nolu parselde bulunan alanda "Depo" yapılmak için yer seçiminin uygun olduğuna &nbsp;oybirliği ile karar verilmiştir. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
