<p style="text-align: justify;">İlimiz, Çerkezköy ilçesi, Gaziosmanpaşa Mahallesi, 578 ada 14 numaralı parsele ilişkin Çerkezköy 1/1000 Ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
