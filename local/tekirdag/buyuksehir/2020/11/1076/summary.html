<p style="text-align: justify;">İlimiz, Çorlu İlçesi, Muhittin Mahallesi, 1329 ada 6 parsel ve 1330 ada 7 nolu parsele ilişkin&nbsp;1/1000 ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
