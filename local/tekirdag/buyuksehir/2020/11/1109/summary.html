<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Yavuz (Karadeniz) Mahallesi, 528 ada 2 parsel numaralı taşınmaza ilişkin sunulan 1/1000 ölçekli Uygulama İmar Planının, 5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca görüşülmesi talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
