<p style="text-align: justify;">İlimiz, Çerkezköy İlçesi, Veliköy Mahallesi, 474 ada 32 parselde yer alan taşınmaz üzerine "Depo" yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verildi. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
