<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Zafer Mahallesi, 2432 ada 12 parsel sayılı taşınmaza ilişkin sunulan 1/5000 ölçekli Nazım İmar Planı değişikliğinin Büyükşehir Belediye Meclisinde görüşülerek onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
