<p style="text-align: justify;">İlimiz, Süleymanpaşa İlçesi, Aydoğdu Mahallesi, 2448 ada 15 nolu parselde bulunan alanda "Depo" yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
