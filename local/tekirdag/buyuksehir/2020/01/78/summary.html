<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, Mimar Sinan Mahallesi, 761 ada 9 nolu parselde bulunan alanda "Lojistik Depolama" yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
