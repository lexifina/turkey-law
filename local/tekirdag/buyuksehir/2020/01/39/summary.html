<p style="text-align: justify;">İlimiz, Süleymanpaşa İlçesi, Nusratlı Mahallesi, 1237 no.lu parselde kayıtlı taşınmazın cephe aldığı sokağa &#39;&#39;5015 Sokak&#39;&#39; isminin verilmesine oybirliği ile karar verilmiştir. Şeklindeki İçişleri Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
