<p style="text-align: justify;">İlimiz Hayrabolu ilçesi İlyas Mahallesi 1191 ada 1 parselde bulunan meydanın ''Cumhuriyet Meydanı'' olarak isimlendirilmesi talebinin kabulüne oybirliği ile karar verilmiştir.&nbsp;Şeklindeki&nbsp;İçişleri Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
