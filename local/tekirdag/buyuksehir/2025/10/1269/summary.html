<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi Hürriyet Mahallesinde bulunan ''Adsız 3. Sokak'' isminin ''Ali KAYALAROĞLU Sokak'' olarak değiştirilmesi talebinin kabulüne oybirliği ile karar verilmiştir.&nbsp;Şeklindeki&nbsp;İçişleri Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
