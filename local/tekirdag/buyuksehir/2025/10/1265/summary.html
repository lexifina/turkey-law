<p style="text-align: justify;">İlimiz, Şarköy ilçesi, Eriklice Mahallesi 102 ada 1 parselin güneyindeki imar yoluna &#39;&#39;Karapoyraz Sokak&#39;&#39; isminin verilmesi talebinin kabulüne oybirliği ile karar verilmiştir.&nbsp;Şeklindeki&nbsp;İçişleri Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
