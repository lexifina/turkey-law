<p style="text-align: justify;">İlimiz Şarköy ilçesi, Camikebir&nbsp;Mahallesinde yapılması planlanan çevre yolunun adının "57. Alay Çevre Yolu" olarak belirlenmesi talebinin kabulüne oybirliği ile karar verilmiştir. Şeklindeki İçişleri Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
