<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Seymenli Mahallesi, 113 ada 42 parsel numaralı taşınmaza ilişkin hazırlanan 1/5000 ölçekli Nazım İmar Planının 5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
