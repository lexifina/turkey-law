<p style="text-align: justify;">İlimiz, Süleymanpaşa İlçesi, Aydoğdu Mahallesi, 2453 ada 2 nolu parselde bulunan alanda "Tekstil Atölyesi" yapılmak için yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki İmar ve Bayındırlık Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
