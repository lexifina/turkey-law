<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Hürriyet Mahallesi, 1715 ada 1, 2, 3, 4 ve 5 parsel numaralı taşınmazlara ilişkin hazırlanan&nbsp; 1/1000 ölçekli Uygulama İmar Planı değişikliği talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
