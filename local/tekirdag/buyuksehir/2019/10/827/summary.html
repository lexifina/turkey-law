<p style="text-align: justify;">Miras Atolyesi I projesi kapsamında Reşat Nuri GÜNTEKİN evi olarak bilinen ilimiz Süleymanpaşa ilçesi, Ertuğrul Mahallesi, 546 ada, 15 ve 16 parsel sayılı taşınmazların kamulaştırılması talebinin Plan ve Bütçe Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
