<p style="text-align: justify;">Şarköy İlçesinin, &nbsp;Camikebir Mahallesi, İstiklal Mahallesi, Mürefte Mahallesi ve Kızılcaterzi Mahallesinde Muhtelif Cadde ve Sokak isim değişikliği ve isimsiz sokaklara ad verilmesi talebinin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
