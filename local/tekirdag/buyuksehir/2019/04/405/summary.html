<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, Atatürk Mahallesi, 2000 ve 2001 adalara ilişkin hazırlanan 1/1000 ölçekli Uygulama İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
