<p style="text-align: justify;">Denetim Komisyonunun (5) üyeden oluşmasına oybirliği ile karar verilmiş olup, gizli oyla yapılan seçim neticesinde&nbsp;&nbsp;Funda SERFİÇE (30),&nbsp;Oğuz ÇAKMAK (30),&nbsp;İsa KUNT (29), Hüseyin Vasfi GÜNER (28) ve Selçuk GÜNDOĞAN (27) oy alarak Denetim Komisyonu Üyesi olarak seçilmişlerdir.</p>
