<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, Atatürk Mahallesi 1278 adanın doğusunda kalan Park Alanlarına ilişkin 1/1000 Ölçekli Nazım İmar Planı değişikliğinin, 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
