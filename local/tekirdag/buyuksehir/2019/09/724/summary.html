<p style="text-align: justify;"><em>"Sağlık İşleri Şube Müdürlüğü tarafından verilen hasta nakil ambulans hizmetleri ile ilgili ücret tarifesindeki, köprü ve feribot giderleri fiyata dahil olup idarece ödenir. (Gidiş-Dönüş)"</em> şeklinde değiştirilmesi talebinin Plan ve Bütçe Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
