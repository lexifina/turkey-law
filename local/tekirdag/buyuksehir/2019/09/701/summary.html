<p style="text-align: justify;">İlimiz, Şarköy ilçesi, İstiklal Mahallesi, 114 ada 40, 41, 42 ve 43 numaralı parsellere ilişkin sunulan 1/1000 ölçekli Uygulama İmar Planı değişikliğinin Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
