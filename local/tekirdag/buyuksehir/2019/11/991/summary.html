<p style="text-align: justify;">Muratlı İlçesi, Aşağısevindikli Mahallesinde Köy Yerleşim Planı bulunan bölgede isimsiz sokaklara ekli listede belirtilen isimlerin verilmesine oybirliği ile karar verilmiştir. Şeklindeki İçişleri Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
