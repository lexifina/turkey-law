<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Gazioğlu Mahallesi, 1088, 1092 ve 153 parsel numaralı taşınmazlara ilişkin hazırlanan 1/1000 ölçekli Uygulama İmar Planı değişikliğinin Büyükşehir Belediye Meclisinde görüşülmesi talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
