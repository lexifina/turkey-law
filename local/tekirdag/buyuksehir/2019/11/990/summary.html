<p style="text-align: justify;">Saray İlçesi merkez mahallelerinde yeni açılacak cadde ve sokaklara ekli listedeki isimlerin Komisyonumuzca düzenlendiği şekliyle verilmesine oybirliği ile karar verilmiştir. Şeklindeki İçişleri Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
