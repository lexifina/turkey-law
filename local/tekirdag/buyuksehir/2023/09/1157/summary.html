<p style="text-align: justify;">İlimiz, Süleymanpaşa ilçesi, Kumbağ Mahallesi, 262 ada 39 parsel numaralı taşınmaza ilişkin sunulan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
