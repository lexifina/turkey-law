<p style="text-align: justify;">İlimiz, Çorlu İlçesi, Kazımiye Mahallesi, 1499 ada 17 numaralı parsele ilişkin sunulan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
