<p style="text-align: justify;">İlimiz, Hayrabolu ilçesi, İlyas Mahallesi, 209 ada 45 parselde kayıtlı taşınmaza ilişkin hazırlanan 1/25000 Ölçekli Çevre Düzeni Planı değişikliğinin 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
