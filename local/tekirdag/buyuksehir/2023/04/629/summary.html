<p style="text-align: justify;">İlimiz, Kapaklı İlçesi, Mimarsinan Mahallesi, 565 ada 3 nolu parselde &#39;Depo&#39; yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verildi. Şeklindeki&nbsp;İmar ve Bayındırlık Komisyonu Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
