<p style="text-align: justify;"><em>İlimiz, Çerkezköy İlçesi, Veliköy Mahallesi, 281 ada, 16 parsel numaralı taşınmaz üzerinde &#39;Depolama&#39; yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir.</em> Şeklindeki&nbsp;İmar ve Bayındırlık Komisyonu Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
