<p style="text-align: justify;"><em>İlimiz, Çerkezköy İlçesi, Veliköy Mahallesi, 470 ada, 14 parsel numaralı taşınmaz üzerinde &#39;Depo&#39; yapılmak üzere yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir.</em> Şeklindeki&nbsp;İmar ve Bayındırlık Komisyonu Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
