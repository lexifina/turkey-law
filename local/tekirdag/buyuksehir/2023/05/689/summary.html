<p style="text-align: justify;">İlimiz, Çorlu ilçesi, Muhittin Mahallesi, 1865 ada 6 ve 7 numaralı parsele ilişkin sunulan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin 5216 sayılı Büyükşehir Belediye Kanunu uyarınca onaylanması talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>
