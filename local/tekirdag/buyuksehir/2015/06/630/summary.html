<p style="text-align: justify;">İlimiz, Saray İlçesi, Büyükyoncalı Mahallesi, 1550 ada 1,2,3,4,5 ve 1551 ada 1,2,3,4,5,6,7 numaralı parsellere ilişkin hazırlanan 1/1000 Ölçekli Uygulama İmar Planı değişikliğinin onaylanması&nbsp;talebin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verilmiştir.</p>
