<p style="text-align: justify;">Talep; Komisyonumuzda görüşülmüş olup; İlyas KÜÇÜKMİDİL&#39;in Özel Halk Otobüs ücretleri hakkındaki talebi ile ilgili Komisyon çalışmalarının devamına oybirliği ile karar verilmiştir. Şeklindeki Plan ve Bütçe Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
