<p style="text-align: justify;">İlimiz, Malkara İlçesi, Camiatik Mahallesi, 523 ada 136 parsel numarasında kayıtlı taşınmaza ilişkin hazırlanan 1/5000 ölçekli Nazım İmar Planı Değişikliğinin onaylanması&nbsp;talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verilmiştir.</p>
