<p style="text-align: justify;">İlimiz Çerkezköy İlçesi, Ambardere Mevkii, 1360,1361 ve 1353 nolu adaları&nbsp;kapsayan alanlara ilişkin hazırlanan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin&nbsp;onaylanması&nbsp;talebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
