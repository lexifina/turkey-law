<p style="text-align: justify;">İlimiz, Marmaraereğlisi İlçesi, 141 ada, 1 parsel numarasında kayıtlı, mülkiyeti Marmaraereğlisi Belediyesine ait taşınmaz için hazırlanan 1/5000 Ölçekli Koruma Amaçlı Nazım İmar Planı değişikliği tlebinin İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.&nbsp;</p>
