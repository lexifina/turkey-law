<p style="text-align: justify;">İlimiz Çerkezköy İlçesi, İstasyon Mahallesi, 1591 ada 3 parsel, 1590 ada 1 ve 2 nolu&nbsp;parsellere ilişkin hazırlanan 1/5000 Ölçekli Nazım İmar Planı değişikliğinin onaylanması talebinin&nbsp;İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
