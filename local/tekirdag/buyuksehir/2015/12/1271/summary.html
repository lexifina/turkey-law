<p style="text-align: justify;">İçişleri Bakanlığının yazısı gereği Katı Atık Depolama Tesisi adı altında Bütçe İçi İşletme kurulabileceği belirtildiğinden ''Tekirdağ Büyükşehir Belediyesi&nbsp;İktisadi ve Sosyal Tesisler İşletmesi'' adında Bütçe İçi İşletme kurulmasına ve onay alınmasına&nbsp;oybirliği ile karar verildi.</p>
