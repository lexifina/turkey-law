<p style="text-align: justify;">Talep; Komisyonumuzda görüşülmüş olup, <em>&ldquo;</em><em>Bilgi İşlem Dairesi Başkanlığı'na ait Görev ve Çalışma Yönetmeliği'nin&rdquo; </em>sunulduğu şekliyle kabulüne oybirliği ile karar verilmiştir. Şeklindeki İçişleri Komisyonu Raporu Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabulüne karar verildi.</p>
