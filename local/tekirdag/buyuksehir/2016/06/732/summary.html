<p style="text-align: justify;">İlimiz Ergene İlçesi, Velimeşe Mahallesi, 697 ada, 14 parselde "Geri Dönüşüm" faaliyeti ile yer seçiminin uygun olduğuna oybirliği ile karar verilmiştir. Şeklindeki Çevre ve Sağlık Komisyonu ile İmar ve Bayındırlık&nbsp;Komisyon Raporu; Komisyondan geldiği şekliyle oylandı ve oybirliği ile kabul edildi.</p>
