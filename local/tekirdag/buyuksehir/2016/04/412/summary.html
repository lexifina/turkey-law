<p style="text-align: justify;">İlimiz, Süleymanpaşa İlçesi, Gazioğlu Mahallesinde bulunan 2414 parsel nolu taşınmazın içerisinde&nbsp;yeni açılmış 4 adet sokağa "Mandarin Sokak", "Ihlamur Sokak", "Zeytin Sokak", "Çınar Sokak" isimlerinin&nbsp;verilmesi&nbsp;&nbsp;talebinin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verilmiştir.</p>
