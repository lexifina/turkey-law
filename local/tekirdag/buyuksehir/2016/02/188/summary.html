<p style="text-align: justify;"><em>"Talep; Komisyonumuzda görüşülmüş olup; Tekirdağ Büyükşehir Belediyesi İmar Yönetmeliği ile ilgili Komisyon çalışmalarının devamına oybirliği ile karar verilmiştir." </em>Şeklindeki&nbsp;İmar ve Bayındırlık Komisyonu Raporu; Komisyondan geldiği şekliyle&nbsp;oylandı ve oybirliği ile kabul edildi.</p>
