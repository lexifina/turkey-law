<p style="text-align: justify;">Tekirdağ İli, Süleymanpaşa ilçesi, Yavuz Mahallesi, 449 ada 15 parsel numaralı&nbsp;taşınmaza ait&nbsp;1/1000 ölçekli Uygulama İmar Planı değişikliğinin&nbsp;5216 sayılı Büyükşehir Belediyesi Kanunu uyarınca onaylanması talebinin&nbsp;İmar ve Bayındırlık Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
