<p style="text-align: justify;">Zabıta Dairesi Başkanlığının 2016 yılında daha etkin hizmet verilmesi maksadıyla planlanan teşkilat yapısına uygun olarak "Tekirdağ Büyükşehir Belediyesi Zabıta Dairesi Başkanlığı Teşkilat Yapısı ve Esasları Yönetmeliği" nin İçişleri Komisyonuna havale edilmesine oybirliği ile karar verildi.</p>
