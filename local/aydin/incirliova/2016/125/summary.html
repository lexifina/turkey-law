<p style="text-align: justify;"><span style="font-size: 12pt;">Belediyemiz norm kadrosundaki teknik hizmetler sınıfında bulunan 5'inci dereceli mimar kadrosunun bir (1) düşürülerek teknik hizmetler sınıfındaki 7'nci dereceli ekonomist kadrosunun ise bir arttırılarak ikiye yükseltilmesine mecliste yapılan oylama neticesinde OYBİRLİĞİ ile karar verildi.<br /><br /></span></p>
