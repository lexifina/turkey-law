Konak ilçesi, Bahçelievler Mahallesi, 22M-1d pafta, 325 Sokağın yaya yolu olarak belirlenmesine ilişkin 1/1000 ölçekli Uygulama İmar Planı Değişiklik önerisinin oybirliği ile reddine ilişkin İmar ve Bayındırlık Komisyonu Raporu. (Nz. Pl .1565) Komisyondan Geldiği Şekilde Oybirliği İle Kabul Edildi.
