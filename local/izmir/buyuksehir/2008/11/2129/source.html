Bornova, Işıkkent 23Ö IIIa, 23Ö IIId paftalarda yer alan E.N.H'nın imar planına işlenmesine ilişkin, 1/1000 ölçekli Uygulama İmar Planı Değişiklik önerisinin Oybirliği ile kabulüne ilişkin İmar ve Bayındırlık Komisyonu Raporu.(Nz.Pl. 11317) <br />Komisyondan Geldiği Şekilde Oybirliği İle Kabul Edildi.
