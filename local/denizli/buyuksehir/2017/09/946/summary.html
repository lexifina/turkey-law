Acıpayam Belediye Meclisinin 07/08/2017 tarih ve 135 no.lu kararı ile kabul edilen; Acıpayam Belediyesi sınırları içerisinde yer alan "Karahöyükafşarı Mahallesi" isminin "Avşar Mahallesi" olarak değiştirilmesinin kabulüne, işaretle oylama neticesinde 18/09/2017 tarihinde oybirliğiyle karar verildi.
