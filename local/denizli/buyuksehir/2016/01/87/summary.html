Belediyemizce "Asfalt Şantiye İnşaatı" işinde kullanılmak üzere İller Bankası A.Ş.'den 20.000.000,00 TL peyderpey veya tek seferde kredi kullanılması hususunun, incelenmek üzere Plan ve Bütçe Komisyonuna havale edilmesine, işaretle oylama neticesinde 18/01/2016 tarihinde oybirliğiyle karar verildi.
